name: macro
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FRED series
        run: |
          python3 - <<'PY'
          import urllib.request, json, datetime, os
          ids=["DTWEXBGS","DGS10","DGS2","DFII10","T10Y2Y","VIXCLS","BAMLH0A0HYM2","DCOILBRENTEU","SP500","NASDAQCOM"]
          start=(datetime.date.today()-datetime.timedelta(days=250)).isoformat()
          old=json.load(open("macro.json")) if os.path.exists("macro.json") else {"series":{}}
          series={}
          for i in ids:
              try:
                  t=urllib.request.urlopen(f"https://fred.stlouisfed.org/graph/fredgraph.csv?id={i}&cosd={start}",timeout=60).read().decode()
                  series[i]=[l.split(",") for l in t.strip().split("\n")[1:]]
              except Exception as e:
                  print("fail",i,e); series[i]=old["series"].get(i,[])
          if series!=old.get("series"):
              json.dump({"updated":datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%MZ"),"series":series},open("macro.json","w"),separators=(",",":"))
              print("changed")
          PY
      - name: Commit
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add macro.json
          git diff --cached --quiet || (git commit -m "macro update" && git push)
